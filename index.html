<title>SOAGA CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: fixed navy app-shell sidebar (Zoho-style module rail) + cream content canvas;
   SOAGA brand red (#990000) marks actions, urgency and the active module. Colors/fonts per BRAND.md. */
:root{
  --bg:#FFF8ED; --surface:#FFFAFA; --surface-2:#F6EEE1; --surface-3:#EFE3D2;
  --border:#E6D9C7; --border-strong:#D8C7AE;
  --text:#111A31; --text-muted:#4A5366; --text-faint:#7A8296;
  --navy:#111A31; --navy-2:#1C2A4A; --navy-ink:#0A1020; --navy-soft:#E4E8F0; --on-navy:#F3F1EA; --on-navy-muted:#AEB4C6;
  --accent:#990000; --accent-ink:#7A0000; --accent-soft:#F7E3E0; --on-accent:#FFFFFF;
  --terracotta:#C87B63; --gold:#FCC97D;
  --success:#1B7A3D; --success-soft:#E6F4EA;
  --warning:#B2650A; --warning-soft:#FEEACD;
  --critical:#7A0000; --critical-soft:#F5D9D6;
  --focus:#355097;
  --shadow:0 1px 2px rgba(17,26,49,.06),0 8px 24px -12px rgba(17,26,49,.18);
  --shadow-lg:0 20px 50px -20px rgba(17,26,49,.35);
  --radius:10px; --radius-sm:7px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F1C; --surface:#141B2E; --surface-2:#101624; --surface-3:#1E2740;
    --border:#2A3350; --border-strong:#394468;
    --text:#F3F1EA; --text-muted:#A9B0C4; --text-faint:#767F99;
    --navy:#0E1526; --navy-2:#1A2543; --navy-ink:#05080F; --navy-soft:#202C4C; --on-navy:#F3F1EA; --on-navy-muted:#8D96B0;
    --accent:#D9453D; --accent-ink:#C23730; --accent-soft:#3A1515; --on-accent:#FFFFFF;
    --terracotta:#D79880; --gold:#F2A93C;
    --success:#34C77A; --success-soft:#0E2B1F;
    --warning:#F2A93C; --warning-soft:#3A2A0C;
    --critical:#E2605A; --critical-soft:#3A1416;
    --focus:#7B9AE0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-lg:0 20px 50px -20px rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F1C; --surface:#141B2E; --surface-2:#101624; --surface-3:#1E2740;
  --border:#2A3350; --border-strong:#394468;
  --text:#F3F1EA; --text-muted:#A9B0C4; --text-faint:#767F99;
  --navy:#0E1526; --navy-2:#1A2543; --navy-ink:#05080F; --navy-soft:#202C4C; --on-navy:#F3F1EA; --on-navy-muted:#8D96B0;
  --accent:#D9453D; --accent-ink:#C23730; --accent-soft:#3A1515; --on-accent:#FFFFFF;
  --terracotta:#D79880; --gold:#F2A93C;
  --success:#34C77A; --success-soft:#0E2B1F;
  --warning:#F2A93C; --warning-soft:#3A2A0C;
  --critical:#E2605A; --critical-soft:#3A1416;
  --focus:#7B9AE0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lg:0 20px 50px -20px rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Roboto",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:700;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- App shell ---------- */
#app{display:flex;height:100%;width:100%}

#sidebar{
  width:228px;flex:none;background:linear-gradient(180deg,var(--navy),var(--navy-2));
  color:var(--on-navy);display:flex;flex-direction:column;
  padding-left:env(safe-area-inset-left,0px);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  transition:transform .22s ease;z-index:55;
}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;flex:none}
#sidebar .brand svg{flex:none}
#sidebar .brand .name{font-weight:700;font-size:15.5px;letter-spacing:.02em;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#sidebar .brand .sub{font-size:10.5px;color:var(--on-navy-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
#sidebar nav{flex:1;overflow-y:auto;padding:6px 10px 10px}
#sidebar .navgroup-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--on-navy-muted);padding:14px 10px 6px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius-sm);color:var(--on-navy-muted);text-decoration:none;font-weight:600;font-size:13.5px;margin-bottom:2px;border:1px solid transparent;position:relative;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.navitem svg{flex:none;opacity:.9}
.navitem:hover{background:rgba(255,255,255,.06);color:var(--on-navy)}
.navitem.active{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow)}
.navitem.active svg{opacity:1}
.navitem .count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:99px;font-family:"Roboto Mono",monospace}
.navitem.active .count{background:rgba(255,255,255,.28)}
#sidebar .foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);flex:none}
#sidebar .foot .hint{font-size:11px;color:var(--on-navy-muted);line-height:1.5}

#scrim{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:35;display:none}
#scrim.show{display:block}

#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}

#topbar{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 18px;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding-top:max(12px, env(safe-area-inset-top,0px));
}
#hamburger{display:none;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);width:34px;height:34px;align-items:center;justify-content:center;color:var(--text)}
#topbar .titlewrap{display:flex;flex-direction:column;min-width:0}
#topbar h1{font-size:17px}
#topbar .crumb{font-size:11.5px;color:var(--text-faint)}
#topbar .search{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:7px 13px;color:var(--text-muted);margin-left:8px}
#topbar .search input{flex:1;border:0;background:none;outline:0;color:var(--text);min-width:0}
#topbar .search svg{flex:none;opacity:.6}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--radius-sm);padding:8px 14px;font-weight:700;font-size:13px;border:1px solid transparent;white-space:nowrap;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-accent:hover{background:var(--accent-ink)}
.btn-ghost{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:var(--radius-sm)}
.btn[disabled]{opacity:.5;cursor:default}
#topbar .spacer{flex:1}
#userchip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2);color:inherit;text-align:left}
#userchip img{width:26px;height:26px;border-radius:99px;flex:none}
#userchip .uname{font-size:12.5px;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px max(16px,env(safe-area-inset-right,0px)) 32px 18px}

/* ---------- generic bits ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:20px}
.page-head p{margin:3px 0 0;color:var(--text-muted);font-size:13px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--text-muted)}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

/* KPI tiles */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:16px 16px 14px;display:flex;flex-direction:column;gap:7px}
.kpi .lbl{font-size:12px;color:var(--text-muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:"Roboto Mono",monospace;font-size:26px;font-weight:600;letter-spacing:-.01em}
.kpi .sub{font-size:11.5px;color:var(--text-faint)}
.kpi .sub.up{color:var(--success)}
.kpi .sub.warn{color:var(--critical)}

.dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media (max-width:980px){.dash-grid{grid-template-columns:1fr}}
.panel{padding:16px}
.panel h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.panel h3 .mini{font-size:11.5px;color:var(--text-faint);font-weight:500}

/* funnel bars */
.funnel-row{display:grid;grid-template-columns:118px 1fr 34px;align-items:center;gap:10px;padding:6px 0}
.funnel-row .track{height:16px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.funnel-row .fill{height:100%;border-radius:5px;background:var(--navy)}
.funnel-row .fill.accent{background:var(--accent)}
.funnel-row .n{font-family:"Roboto Mono",monospace;font-size:12px;text-align:right;color:var(--text-muted)}
.funnel-row .lbl{font-size:12.5px;color:var(--text)}

.feed-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.feed-item:last-child{border-bottom:0}
.feed-ico{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--navy-soft);color:var(--navy)}
:root[data-theme="dark"] .feed-ico,@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .feed-ico{color:var(--on-navy)}}
.feed-body{min-width:0;flex:1}
.feed-title{font-size:12.5px;font-weight:600}
.feed-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px}
.feed-time{font-size:10.5px;color:var(--text-faint);flex:none}

/* table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
.row-name{font-weight:600}
.row-sub{font-size:11.5px;color:var(--text-faint)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-navy{background:var(--navy-soft);color:var(--navy)}
:root[data-theme="dark"] .badge-navy{color:var(--on-navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge-navy{color:var(--on-navy)}}
.badge-accent{background:var(--accent-soft);color:var(--accent-ink)}
:root[data-theme="dark"] .badge-accent,{color:var(--accent-ink)}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-critical{background:var(--critical-soft);color:var(--critical)}
.badge-muted{background:var(--surface-3);color:var(--text-muted)}
.dot{width:7px;height:7px;border-radius:99px;flex:none;background:currentColor}

.score-pill{display:inline-flex;align-items:center;gap:6px;font-family:"Roboto Mono",monospace;font-weight:600;font-size:12px}
.score-bar{width:44px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.score-bar i{display:block;height:100%}

.avatar{width:24px;height:24px;border-radius:99px;flex:none;object-fit:cover}
.owner-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}

.empty{padding:40px 20px;text-align:center;color:var(--text-faint)}
.empty svg{opacity:.5;margin-bottom:10px}
.empty .t{font-weight:600;color:var(--text-muted);font-size:13.5px}
.empty .d{font-size:12.5px;margin-top:3px}

/* Kanban */
#pipeline-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kcol{flex:none;width:252px;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);max-height:calc(100vh - 230px)}
.kcol-head{padding:11px 12px 9px;flex:none;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.kcol-head .t{font-size:12.5px;font-weight:700}
.kcol-head .n{font-family:"Roboto Mono",monospace;font-size:11px;color:var(--text-faint);background:var(--surface);border:1px solid var(--border);padding:1px 7px;border-radius:99px}
.kcol-body{flex:1;overflow-y:auto;padding:9px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.kcol-body.dragover{background:var(--navy-soft)}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 11px;cursor:grab;box-shadow:var(--shadow)}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.4}
.kcard .nm{font-weight:600;font-size:13px}
.kcard .co{font-size:11.5px;color:var(--text-faint);margin-top:1px}
.kcard .meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.kcard .amt{font-family:"Roboto Mono",monospace;font-size:11.5px;color:var(--text-muted);font-weight:600}

/* Drawer */
#drawer-scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
#drawer-scrim.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);z-index:51;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
#drawer.show{transform:translateX(0)}
#drawer .dhead{flex:none;padding:16px 16px 12px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
#drawer .dhead .ava{width:42px;height:42px;border-radius:11px;background:var(--navy);color:var(--on-navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
#drawer .dhead .info{min-width:0;flex:1}
#drawer .dhead h3{font-size:16px}
#drawer .dhead .co{font-size:12.5px;color:var(--text-muted)}
#drawer .dtabs{flex:none;display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--border);overflow-x:auto}
.dtab{padding:10px 11px;font-size:12.5px;font-weight:600;color:var(--text-faint);border-bottom:2px solid transparent;white-space:nowrap}
.dtab.active{color:var(--accent);border-color:var(--accent)}
#drawer .dbody{flex:1;overflow-y:auto;padding:14px 16px 24px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:9px 10px;font-size:13px;margin-bottom:14px}
.kv .k{color:var(--text-faint);font-size:11.5px;padding-top:2px}
.kv .v{min-width:0}
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:7px;padding:8px 10px;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 20%,transparent)}
.field textarea{resize:vertical;min-height:62px}
.field-row{display:flex;gap:10px}
.field-row>.field{flex:1;min-width:0}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin:16px 0 9px}
.section-title:first-child{margin-top:0}
.sep{height:1px;background:var(--border);margin:14px 0}

.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:10px;position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:1px;background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-dot{width:27px;height:27px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface-3);color:var(--text-muted);z-index:1}
.tl-body{min-width:0;flex:1;padding-top:2px}
.tl-head{display:flex;justify-content:space-between;gap:8px}
.tl-type{font-size:12px;font-weight:700}
.tl-time{font-size:11px;color:var(--text-faint);flex:none}
.tl-text{font-size:12.5px;color:var(--text-muted);margin-top:2px;white-space:pre-wrap}
.tl-author{font-size:11px;color:var(--text-faint);margin-top:3px}

.mini-list{display:flex;flex-direction:column;gap:7px}
.mini-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
.mini-row .chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-strong);flex:none;display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.mini-row .chk.done{background:var(--success);border-color:var(--success)}
.mini-row .t{flex:1;min-width:0;font-size:12.5px;font-weight:500}
.mini-row .t.done{text-decoration:line-through;color:var(--text-faint)}
.mini-row .d{font-size:11px;color:var(--text-faint);flex:none}
.mini-row .d.late{color:var(--critical);font-weight:600}

/* Modal */
#modal-scrim{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
#modal-scrim.show{display:flex}
#modal{width:min(520px,100%);max-height:90vh;display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg)}
#modal .mhead{flex:none;padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#modal .mhead h3{font-size:15.5px}
#modal .mbody{flex:1;overflow-y:auto;padding:16px 18px}
#modal .mfoot{flex:none;padding:13px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

.confirm-del{color:var(--critical);border-color:var(--critical-soft);background:var(--critical-soft)}

.toast-wrap{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--navy-ink);color:var(--on-navy);padding:10px 16px;border-radius:99px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(8px);transition:all .18s}
.toast.show{opacity:1;transform:translateY(0)}

@media (max-width:880px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  #sidebar.show{transform:translateX(0)}
  #hamburger{display:flex}
  #topbar .search{display:none}
  #view{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .kv{grid-template-columns:84px 1fr}
}
@media (max-width:560px){
  #userchip .uname{display:none}
  .dash-grid{gap:10px}
  #topbar{padding-left:12px}
}
[hidden]{display:none!important}

<script>
(function(){
"use strict";

/* ===================== constants ===================== */
var STAGES = [
  {id:'nouveau',label:'Nouveau lead',short:'Nouveau'},
  {id:'a_qualifier',label:'À qualifier',short:'À qualifier'},
  {id:'qualifie',label:'Qualifié',short:'Qualifié'},
  {id:'prospect',label:'Prospect',short:'Prospect'},
  {id:'opportunite',label:'Opportunité',short:'Opportunité'},
  {id:'client',label:'Client',short:'Client'},
  {id:'perdu',label:'Perdu',short:'Perdu'},
  {id:'a_reactiver',label:'À réactiver',short:'À réactiver'}
];
var STAGE_MAP = {}; STAGES.forEach(function(s){STAGE_MAP[s.id]=s;});
var LEAD_STAGES = ['nouveau','a_qualifier','qualifie'];
var SOURCES = ['Site web','Référence client','Réseaux sociaux','Salon / événement','Campagne marketing','Appel entrant','WhatsApp','Partenaire','Autre'];
var TASK_TYPES = {tache:'Tâche',rdv:'Rendez-vous',relance:'Relance',appel:'Appel'};
var INTERACTION_TYPES = {email:'E-mail',appel:'Appel',rdv:'Rendez-vous',whatsapp:'WhatsApp',sms:'SMS',reunion:'Réunion',note:'Note'};
var TICKET_CATS = ['Compte & accès','Produit / épargne','Facturation','Réclamation','Information générale','Autre'];
var PRIORITIES = {basse:{label:'Basse',hours:120,cls:'badge-muted'},normale:{label:'Normale',hours:72,cls:'badge-navy'},haute:{label:'Haute',hours:24,cls:'badge-warning'},urgente:{label:'Urgente',hours:4,cls:'badge-critical'}};
var TICKET_STATUSES = {ouvert:{label:'Ouvert',cls:'badge-critical'},en_cours:{label:'En cours',cls:'badge-warning'},resolu:{label:'Résolu',cls:'badge-success'},ferme:{label:'Fermé',cls:'badge-muted'}};
var TASK_STATUS_LABELS = {a_faire:'À faire', fait:'Terminée'};
var ENTITY_LABELS = {contact:'Fiche', task:'Tâche', ticket:'Ticket', interaction:'Échange', campaign:'Campagne', kb:'Article', team:'Rôle'};
var ENTITY_GENDER = {contact:'f', task:'f', ticket:'m', interaction:'m', campaign:'f', kb:'m', team:'m'};
var PARTICIPLE = {
  create:{f:'créée',m:'créé'},
  update:{f:'modifiée',m:'modifié'},
  delete:{f:'supprimée',m:'supprimé'}
};
var CONTACT_FIELD_LABELS = {stage:'Étape', score:'Score', amount:'Montant', probability:'Probabilité', notes:'Notes', ownerId:'Propriétaire'};
var ROLES = {commercial:'Commercial', service_client:'Service client', marketing:'Marketing', direction:'Direction', admin:'Administrateur'};
var CAMPAIGN_CHANNELS = {email:'E-mail', sms:'SMS', whatsapp:'WhatsApp', notification:'Notification mobile', reseaux:'Réseaux sociaux'};
var CAMPAIGN_STATUS = {brouillon:{label:'Brouillon',cls:'badge-muted'}, terminee:{label:'Terminée',cls:'badge-success'}};
var KB_CATS = ['Compte & accès','Produit / épargne','Facturation','Procédure interne','Autre'];

var ICONS = {
  dashboard:'<path d="M4 13h6V4H4v9zM14 20h6v-9h-6v9zM14 4v5h6V4h-6zM4 20h6v-5H4v5z"/>',
  leads:'<path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  pipeline:'<path d="M3 6h18M7 12h10M11 18h2"/>',
  clients:'<path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="8" r="5"/>',
  activities:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  tickets:'<path d="M3 11l18-5v12l-18-5z"/><path d="M11.5 7.5l1 9"/>',
  chevron:'<path d="M9 18l6-6-6-6"/>',
  campaign:'<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6l-5 4H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a4 4 0 0 1 0 7"/><path d="M18.5 5.5a8 8 0 0 1 0 13"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  reports:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 15l3.5-5 3 3L19 7"/>',
  team:'<path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/>'
};
function icon(name,size){return '<svg width="'+(size||16)+'" height="'+(size||16)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>';}

var NAV = [
  {id:'dashboard',label:'Tableau de bord',icon:'dashboard'},
  {id:'leads',label:'Leads',icon:'leads',count:true},
  {id:'pipeline',label:'Pipeline',icon:'pipeline'},
  {id:'clients',label:'Clients & partenaires',icon:'clients'},
  {id:'activities',label:'Activités & tâches',icon:'activities',count:true},
  {id:'tickets',label:'Tickets',icon:'tickets',count:true},
  {id:'campaigns',label:'Campagnes',icon:'campaign'},
  {id:'kb',label:'Base de connaissances',icon:'book'},
  {id:'reports',label:'Rapports',icon:'reports'},
  {id:'team',label:'Équipe',icon:'team',adminOnly:true}
];

/* ===================== state ===================== */
var S = {
  route:'dashboard',
  contacts:[], tasks:[], tickets:[], interactions:[], audit:[], team:[], campaigns:[], kb:[],
  loaded:{contacts:false,tasks:false,tickets:false,interactions:false,audit:false,team:false,campaigns:false,kb:false},
  me:null, profileCache:{}, canEdit:false, myRole:'commercial',
  db:null, userCap:null,
  search:'', leadFilter:'all', clientFilter:'all', taskFilter:'open', ticketFilter:'open',
  reportRange:'30', reportOwner:'all',
  drawer:{open:false,contactId:null,tab:'infos'},
};

function uid(){return 'id'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);}
function nowISO(){return new Date().toISOString();}
function byId(arr,id){for(var i=0;i<arr.length;i++) if(arr[i]._id===id) return arr[i]; return null;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtAmount(n){ n=Number(n)||0; return n.toLocaleString('fr-FR')+' FCFA'; }
function fmtDate(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d)) return '—'; return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d)) return '—'; return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function timeAgo(iso){
  if(!iso) return '—';
  var d=new Date(iso); if(isNaN(d)) return '—';
  var diff=(Date.now()-d.getTime())/1000;
  if(diff<60) return 'à l\'instant';
  if(diff<3600) return Math.floor(diff/60)+' min';
  if(diff<86400) return Math.floor(diff/3600)+' h';
  if(diff<86400*30) return Math.floor(diff/86400)+' j';
  return fmtDate(iso);
}
function initials(name){
  if(!name) return '?';
  var parts=name.trim().split(/\s+/);
  return ((parts[0]||'')[0]||'')+((parts[1]||'')[0]||'');
}
function scoreColor(score){
  if(score>=66) return 'var(--success)';
  if(score>=34) return 'var(--warning)';
  return 'var(--critical)';
}
function scoreLabel(score){
  if(score>=66) return 'Chaud';
  if(score>=34) return 'Tiède';
  return 'Froid';
}
function toast(msg){
  var wrap=document.getElementById('toastwrap');
  var el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  wrap.appendChild(el);
  requestAnimationFrame(function(){el.classList.add('show');});
  setTimeout(function(){el.classList.remove('show'); setTimeout(function(){el.remove();},220);},2600);
}

/* ===================== profiles (viewer identity) ===================== */
function profileName(id){
  if(!id) return '';
  var p=S.profileCache[id];
  return p? (p.name||'') : '';
}
function ensureProfiles(ids,cb){
  ids=(ids||[]).filter(Boolean);
  if(!ids.length || !S.userCap){ if(cb) cb(); return; }
  S.userCap.profiles(ids).then(function(map){
    for(var k in map){ S.profileCache[k]=map[k]; }
    if(cb) cb();
  }).catch(function(){ if(cb) cb(); });
}

/* ===================== audit trail ===================== */
function logAudit(entityType,entityId,label,action,changes){
  if(!S.db) return;
  S.db.collection('audit').add({
    entityType:entityType, entityId:entityId, label:label, action:action,
    changes:changes||null, actorId:(S.me&&S.me.id)||null, createdAt:nowISO()
  }).catch(function(e){ console.warn('audit log failed',e); });
}
function formatContactFieldValue(field,value){
  if(field==='stage') return value && STAGE_MAP[value] ? STAGE_MAP[value].label : '—';
  if(field==='amount') return fmtAmount(value||0);
  if(field==='probability') return (value||0)+'%';
  if(field==='score') return String(value==null?0:value);
  if(field==='ownerId') return value ? (profileName(value)||'un membre') : 'Non assigné';
  if(field==='notes'){ var t=(value||'').toString().trim(); if(!t) return '(vide)'; return t.length>50? t.slice(0,50)+'…' : t; }
  return String(value==null?'—':value);
}
function diffContactFields(before,after,fields){
  var changes=[];
  fields.forEach(function(f){
    var a=before? before[f] : undefined, b=after[f];
    if(a===undefined) a=null; if(b===undefined) b=null;
    var same = f==='notes' ? (String(a||'')===String(b||'')) : (a===b);
    if(!same){ changes.push({field:f, fieldLabel:CONTACT_FIELD_LABELS[f]||f, from:formatContactFieldValue(f,a), to:formatContactFieldValue(f,b)}); }
  });
  return changes;
}
function auditEntityIcon(entityType){
  return entityType==='contact'?'leads': entityType==='task'?'activities': entityType==='ticket'?'tickets':
    entityType==='campaign'?'campaign': entityType==='kb'?'book': entityType==='team'?'team':'activities';
}
function auditTitle(entry){
  var g=ENTITY_GENDER[entry.entityType]||'m';
  var ent=ENTITY_LABELS[entry.entityType]||entry.entityType;
  var part=(PARTICIPLE[entry.action]||{})[g]||entry.action;
  return ent+' '+part+' : '+esc(entry.label);
}
function auditSub(entry){
  var who=esc(profileName(entry.actorId)||'un membre de l\'équipe');
  if(entry.changes && entry.changes.length){
    var parts=entry.changes.map(function(c){ return esc(c.fieldLabel)+' : '+esc(c.from)+' → '+esc(c.to); });
    return parts.join(' · ')+' · par '+who;
  }
  return 'par '+who;
}

/* ===================== derived data ===================== */
function activeContacts(){ return S.contacts.filter(function(c){return !c.isPartner;}); }
function isOpenStage(stage){ return stage!=='perdu' && stage!=='client'; }
function pipelineValue(){
  return activeContacts().filter(function(c){
    return (c.stage==='prospect'||c.stage==='opportunite') && isOpenStage(c.stage);
  }).reduce(function(s,c){return s+(Number(c.amount)||0);},0);
}
function conversionRate(){
  var total=activeContacts().filter(function(c){return c.stage!=='a_reactiver';}).length;
  var clients=activeContacts().filter(function(c){return c.stage==='client';}).length;
  if(!total) return 0;
  return Math.round(clients/total*100);
}
function stageCount(stage){ return activeContacts().filter(function(c){return c.stage===stage;}).length; }
function newLeadsThisMonth(){
  var now=new Date(); var m=now.getMonth(), y=now.getFullYear();
  return S.contacts.filter(function(c){ if(!c.createdAt) return false; var d=new Date(c.createdAt); return d.getMonth()===m && d.getFullYear()===y; }).length;
}
function openTicketsCount(){ return S.tickets.filter(function(t){return t.status==='ouvert'||t.status==='en_cours';}).length; }
function slaDeadline(t){
  var p=PRIORITIES[t.priority]||PRIORITIES.normale;
  var created=new Date(t.createdAt||nowISO());
  return new Date(created.getTime()+p.hours*3600*1000);
}
function slaState(t){
  if(t.status==='resolu'||t.status==='ferme') return {label:'Clos',cls:'badge-muted',late:false};
  var dl=slaDeadline(t); var now=new Date();
  var diffH=(dl-now)/3600000;
  if(diffH<0) return {label:'SLA dépassé',cls:'badge-critical',late:true};
  if(diffH<4) return {label:'Échéance proche',cls:'badge-warning',late:false};
  return {label:'Dans les temps',cls:'badge-success',late:false};
}
function overdueTicketsCount(){ return S.tickets.filter(function(t){ return slaState(t).late; }).length; }
function tasksThisWeek(){
  var now=new Date(); var in7=new Date(now.getTime()+7*86400000);
  return S.tasks.filter(function(t){ if(t.status==='fait') return false; var d=new Date(t.dueDate); return d<=in7; })
    .sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);});
}
function isTaskLate(t){ if(t.status==='fait') return false; var d=new Date(t.dueDate); var today=new Date(); today.setHours(23,59,59,999); return d<today && d.toDateString()!==new Date().toDateString() ? d<new Date() : d<new Date(new Date().setHours(0,0,0,0)); }
function contactTasks(id){ return S.tasks.filter(function(t){return t.contactId===id;}).sort(function(a,b){return new Date(a.dueDate)-new Date(b.dueDate);}); }
function contactTickets(id){ return S.tickets.filter(function(t){return t.contactId===id;}).sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);}); }
function contactInteractions(id){ return S.interactions.filter(function(i){return i.contactId===id;}).sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);}); }
function recentFeed(limit){
  return S.audit.slice(0,limit||8);
}
function avgCsat(){
  var withCsat=S.tickets.filter(function(t){return t.csat;});
  if(!withCsat.length) return null;
  var sum=withCsat.reduce(function(s,t){return s+t.csat;},0);
  return (sum/withCsat.length).toFixed(1);
}
function topCategories(limit){
  var counts={};
  S.tickets.forEach(function(t){ var k=t.category||'Autre'; counts[k]=(counts[k]||0)+1; });
  return Object.keys(counts).map(function(k){return {label:k,count:counts[k]};}).sort(function(a,b){return b.count-a.count;}).slice(0,limit||5);
}
function campaignTargets(camp){
  return S.contacts.filter(function(c){
    if(c.isPartner) return false;
    if(camp.segmentStage && camp.segmentStage!=='all' && c.stage!==camp.segmentStage) return false;
    if(camp.segmentSource && camp.segmentSource!=='all' && c.source!==camp.segmentSource) return false;
    return true;
  });
}
function uniqueOwners(){
  var ids={};
  S.contacts.forEach(function(c){ if(c.ownerId) ids[c.ownerId]=true; });
  return Object.keys(ids).map(function(id){ return {id:id, name: profileName(id)||'Membre'}; });
}

/* ===================== routing ===================== */
function setRoute(r){
  S.route=r;
  location.hash='#'+r;
  closeDrawer();
  render();
}
window.addEventListener('hashchange',function(){
  var r=(location.hash||'#dashboard').slice(1).split('?')[0];
  if(!NAV.some(function(n){return n.id===r;})) r='dashboard';
  S.route=r; render();
});

/* ===================== DB wiring ===================== */
function initCapabilities(){
  if(!window.claude || !window.claude.use){ renderUnavailableBanner(); render(); return; }
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(res){
    S.db = res[0]; S.userCap = res[1];
    if(!S.db){ renderUnavailableBanner(); }
    else { subscribeAll(); }
    if(S.userCap){
      S.userCap.me().then(function(me){
        S.me = me;
        document.getElementById('uname').textContent = me.name || 'Vous';
        document.getElementById('uavatar').src = me.avatarUrl;
        if(me.id) S.profileCache[me.id] = {id:me.id,name:me.name||'Vous',avatarUrl:me.avatarUrl,color:me.color,isMe:true};
        var mine = me.id ? S.team.find(function(t){return t._id===me.id;}) : null;
        S.myRole = (mine && mine.role) ? mine.role : 'commercial';
        render();
      }).catch(function(){});
      S.userCap.canEdit().then(function(v){ S.canEdit=!!v; render(); }).catch(function(){});
    } else {
      document.getElementById('uname').textContent='Invité';
    }
    render();
  }).catch(function(){ renderUnavailableBanner(); render(); });
}
var bannerShown=false;
function renderUnavailableBanner(){
  if(bannerShown) return; bannerShown=true;
  var v=document.getElementById('view');
  // shown inline by render() via S.db null check instead
}

function subscribeAll(){
  S.db.collection('contacts').orderBy('createdAt','desc').onSnapshot(function(snap){
    S.contacts = snap.docs.map(function(d){ var o=Object.assign({_id:d.id}, d.data()); return o; });
    S.loaded.contacts = true;
    var owners = S.contacts.map(function(c){return c.ownerId;}).concat(S.contacts.map(function(c){return c.createdBy;}));
    ensureProfiles(owners, render);
    render();
  }, function(err){ console.warn('contacts',err); S.loaded.contacts=true; render(); });

  S.db.collection('tasks').orderBy('dueDate','asc').onSnapshot(function(snap){
    S.tasks = snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
    S.loaded.tasks = true;
    ensureProfiles(S.tasks.map(function(t){return t.assigneeId;}), render);
    render();
  }, function(err){ console.warn('tasks',err); S.loaded.tasks=true; render(); });

  S.db.collection('tickets').orderBy('createdAt','desc').onSnapshot(function(snap){
    S.tickets = snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
    S.loaded.tickets = true;
    render();
  }, function(err){ console.warn('tickets',err); S.loaded.tickets=true; render(); });

  S.db.collection('interactions').orderBy('createdAt','desc').onSnapshot(function(snap){
    S.interactions = snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
    S.loaded.interactions = true;
    ensureProfiles(S.interactions.map(function(i){return i.authorId;}), render);
    render();
  }, function(err){ console.warn('interactions',err); S.loaded.interactions=true; render(); });

  S.db.collection('audit').orderBy('createdAt','desc').limit(300).onSnapshot(function(snap){
    S.audit = snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
    S.loaded.audit = true;
    ensureProfiles(S.audit.map(function(a){return a.actorId;}), render);
    render();
  }, function(err){ console.warn('audit',err); S.loaded.audit=true; render(); });

  S.db.collection('team').onSnapshot(function(snap){
    S.team = snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
    S.loaded.team = true;
    var mine = S.me&&S.me.id ? S.team.find(function(t){return t._id===S.me.id;}) : null;
    S.myRole = (mine && mine.role) ? mine.role : 'commercial';
    ensureProfiles(S.team.map(function(t){return t._id;}), render);
    render();
  }, function(err){ console.warn('team',err); S.loaded.team=true; render(); });

  S.db.collection('campaigns').orderBy('createdAt','desc').onSnapshot(function(snap){
    S.campaigns = snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
    S.loaded.campaigns = true;
    render();
  }, function(err){ console.warn('campaigns',err); S.loaded.campaigns=true; render(); });

  S.db.collection('kb_articles').orderBy('createdAt','desc').onSnapshot(function(snap){
    S.kb = snap.docs.map(function(d){ return Object.assign({_id:d.id}, d.data()); });
    S.loaded.kb = true;
    ensureProfiles(S.kb.map(function(a){return a.authorId;}), render);
    render();
  }, function(err){ console.warn('kb',err); S.loaded.kb=true; render(); });
}

function writeCheck(){
  if(!S.db){ toast('Stockage indisponible dans cet aperçu.'); return false; }
  return true;
}

/* ===================== sidebar / topbar ===================== */
function renderNav(){
  var html='';
  NAV.filter(function(n){ return !n.adminOnly || S.canEdit; }).forEach(function(n){
    var count = n.id==='leads' ? S.contacts.filter(function(c){return !c.isPartner && LEAD_STAGES.indexOf(c.stage)>=0;}).length
      : n.id==='activities' ? S.tasks.filter(function(t){return t.status!=='fait';}).length
      : n.id==='tickets' ? openTicketsCount()
      : null;

    case 'tickets': return {title:'Tickets & réclamations',crumb:'Suivi du service client et des SLA',newLabel:'Nouveau ticket',search:false};

  html+='</div>';

  html+='<h3>Tickets à surveiller</h3>';

  if(!urgent.length){ html+=emptyState('tickets','Aucun ticket ouvert','La file de réclamations est vide.'); }
  else {
    html+='<div class="mini-list">';
    urgent.forEach(function(t){
      var sla=slaState(t);
      var c=byId(S.contacts,t.contactId);
      html+='<div class="mini-row" style="cursor:pointer" data-open-contact="'+t.contactId+'"><span class="badge '+sla.cls+'">'+sla.label+'</span><span class="t">'+esc(t.subject)+(c?' · <span style="color:var(--text-faint)">'+esc(c.name)+'</span>':'')+'</span></div>';
    });
    html+='</div>';
  }
  html+='</div>';
  html+='</div>';

  html+='<div class="dash-grid" style="margin-top:14px">';
  html+='<div class="card panel"><h3>Satisfaction client (CSAT)</h3>';

  if(csat===null){ html+=emptyState('tickets','Pas encore de retour','La note de satisfaction apparaît après la clôture d\'un ticket.'); }
  else { html+='<div class="val mono" style="font-size:28px">'+csat+' / 5</div><div style="color:var(--text-faint);font-size:12px;margin-top:4px">Moyenne sur '+S.tickets.filter(function(t){return t.csat;}).length+' retour(s)</div>'; }

function scorePill(score){
  score=Number(score)||0;

function ownerChip(id){
  if(!id) return '<span class="row-sub">Non assigné</span>';
  var p=S.profileCache[id];

  var av=p?p.avatarUrl:'';
  return '<span class="owner-chip">'+(av?'<img class="avatar" src="'+av+'">':'')+'<span>'+esc(name)+(p&&p.isMe?' (vous)':'')+'</span></span>';
}
function filterBySearch(list){
  var q=S.search.toLowerCase();
  return list.filter(function(c){
    return (c.name||'').toLowerCase().indexOf(q)>=0 || (c.company||'').toLowerCase().indexOf(q)>=0 || (c.email||'').toLowerCase().indexOf(q)>=0;
  });
}

      html+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px">';
      html+=campStat('Envoyés', stats.sent||0);
      html+=campStat('Ouverts', stats.opened||0, stats.sent?Math.round((stats.opened||0)/stats.sent*100)+'%':null);
      html+=campStat('Clics', stats.clicked||0, stats.opened?Math.round((stats.clicked||0)/stats.opened*100)+'%':null);
      html+=campStat('Conversions', stats.converted||0, stats.clicked?Math.round((stats.converted||0)/stats.clicked*100)+'%':null);
      html+='</div>';
    }
    if(camp.message) html+='<div class="row-sub" style="margin-top:10px;white-space:pre-wrap">'+esc(camp.message)+'</div>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}
function campStat(label,val,pct){
  return '<div><div style="font-size:10.5px;color:var(--text-faint);font-weight:600;text-transform:uppercase">'+label+'</div><div class="mono" style="font-size:17px;font-weight:600">'+val+(pct?' <span style="font-size:11px;color:var(--text-faint);font-weight:500">('+pct+')</span>':'')+'</div></div>';
}

/* ===================== view: reports ===================== */
function viewReports(){
  var owners=uniqueOwners();
  var html='<div class="page-head"><div><h2>Rapports</h2><p>Analyses consolidées, prévisions par propriétaire et export des données.</p></div></div>';
  html+='<div class="toolbar" style="margin-bottom:16px">';
  html+='<select id="report-range" class="chip" style="padding:5px 10px"><option value="7"'+(S.reportRange==='7'?' selected':'')+'>7 derniers jours</option><option value="30"'+(S.reportRange==='30'?' selected':'')+'>30 derniers jours</option><option value="90"'+(S.reportRange==='90'?' selected':'')+'>90 derniers jours</option><option value="all"'+(S.reportRange==='all'?' selected':'')+'>Depuis le début</option></select>';
  html+='<select id="report-owner" class="chip" style="padding:5px 10px"><option value="all">Tous les propriétaires</option>'+owners.map(function(o){return '<option value="'+o.id+'"'+(S.reportOwner===o.id?' selected':'')+'>'+esc(o.name)+'</option>';}).join('')+'</select>';
  html+='<button class="btn btn-ghost btn-sm" id="export-csv">Exporter les fiches en CSV</button>';
  html+='</div>';

  var since = S.reportRange==='all'? null : new Date(Date.now()-Number(S.reportRange)*86400000);
  var scoped = activeContacts().filter(function(c){
    if(S.reportOwner!=='all' && c.ownerId!==S.reportOwner) return false;
    if(since && new Date(c.createdAt) < since) return false;
    return true;
  });
  var ticketsInRange = S.tickets.filter(function(t){ return !since || new Date(t.createdAt)>=since; });
  var resolved = ticketsInRange.filter(function(t){return t.resolvedAt;});
  var avgResH = resolved.length? Math.round(resolved.reduce(function(s,t){return s+(new Date(t.resolvedAt)-new Date(t.createdAt))/3600000;},0)/resolved.length) : null;
  var csatR=avgCsat();

  html+='<div class="kpi-grid">';
  html+=kpiTile('Nouveaux leads (période)', scoped.filter(function(c){return LEAD_STAGES.indexOf(c.stage)>=0;}).length, S.reportRange==='all'?'depuis le début':'derniers '+S.reportRange+' j');
  html+=kpiTile('Clients (période)', scoped.filter(function(c){return c.stage==='client';}).length, 'conversions');
  html+=kpiTile('Délai moyen de résolution', avgResH!==null? avgResH+' h' : '—', resolved.length+' ticket(s) résolu(s)');
  html+=kpiTile('CSAT moyen', csatR!==null? csatR+' / 5' : '—', 'satisfaction client');
  html+='</div>';

  html+='<div class="card panel"><h3>Prévisions par propriétaire <span class="mini">valeur du pipeline ouvert (prospect + opportunité)</span></h3>';
  var byOwner={};
  activeContacts().filter(function(c){ return (c.stage==='prospect'||c.stage==='opportunite'); }).forEach(function(c){
    var k=c.ownerId||'__none__';
    byOwner[k]=byOwner[k]||{count:0,amount:0};
    byOwner[k].count++; byOwner[k].amount+=Number(c.amount)||0;
  });
  var rows=Object.keys(byOwner).map(function(k){return {owner:k,count:byOwner[k].count,amount:byOwner[k].amount};}).sort(function(a,b){return b.amount-a.amount;});
  if(!rows.length){ html+=emptyState('reports','Aucune opportunité ouverte','Le pipeline prospect/opportunité est vide.'); }
  else {
    html+='<div class="table-wrap"><table><thead><tr><th>Propriétaire</th><th>Opportunités</th><th>Valeur</th></tr></thead><tbody>';
    rows.forEach(function(r){
      html+='<tr style="cursor:default"><td>'+(r.owner==='__none__'?'<span class="row-sub">Non assigné</span>':ownerChip(r.owner))+'</td><td class="mono">'+r.count+'</td><td class="mono">'+fmtAmount(r.amount)+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';
  return html;
}

/* ===================== main render ===================== */
function render(){
  renderNav();
  renderTopbar();
  var v=document.getElementById('view');
  if(!S.db && window.claude && window.claude.use){
    v.innerHTML='<div class="card panel" style="margin-bottom:16px;border-color:var(--warning)"><h3 style="color:var(--warning)">Stockage partagé indisponible dans cet aperçu</h3><p style="color:var(--text-muted);font-size:13px;margin-top:4px">Ouvrez le lien publié de l\'artefact pour que les données soient enregistrées et partagées avec l\'équipe.</p></div>';

  }

  switch(S.route){
    case 'dashboard': html=viewDashboard(); break;
    case 'leads': html=viewLeads(); break;
    case 'pipeline': html=viewPipeline(); break;

/* ===================== mutations ===================== */
function saveContactFromDrawer(c){
  if(!writeCheck()) return;
  var d=document.getElementById('drawer');
  var scoreEl=d.querySelector('[data-field="score"]');
  var amtEl=d.querySelector('[data-field="amount"]');
  var probEl=d.querySelector('[data-field="probability"]');
  var notesEl=d.querySelector('[data-field="notes"]');
  var after={
    score: scoreEl? Number(scoreEl.value) : c.score,
    amount: amtEl? (Number(amtEl.value)||0) : c.amount,
    probability: probEl? (Number(probEl.value)||0) : c.probability,
    notes: notesEl? notesEl.value : c.notes
  };
  var fields=[];
  if(scoreEl) fields.push('score');
  if(amtEl) fields.push('amount');
  if(probEl) fields.push('probability');
  if(notesEl) fields.push('notes');
  var changes=diffContactFields(c,after,fields);
  if(!changes.length){ toast('Aucune modification à enregistrer.'); return; }
  var patch={updatedAt:nowISO()};
  changes.forEach(function(ch){ patch[ch.field]=after[ch.field]; });
  S.db.collection('contacts').doc(c._id).update(patch).then(function(){
    toast('Fiche mise à jour.');
    logAudit('contact', c._id, c.name, 'update', changes);
  }).catch(function(e){ toast('Erreur : '+e.message); });
}
function deleteDoc(kind,id){
  if(!writeCheck()) return;
  var coll = kind==='contact'?'contacts':kind==='task'?'tasks':kind==='ticket'?'tickets':null;
  if(!coll) return;
  var src = kind==='contact'?S.contacts:kind==='task'?S.tasks:S.tickets;
  var rec = byId(src,id);
  var label = rec ? (rec.name||rec.title||rec.subject||id) : id;
  S.db.collection(coll).doc(id).delete().then(function(){
    toast('Élément supprimé.');
    logAudit(kind, id, label, 'delete', null);
    if(kind==='contact' && S.drawer.contactId===id) closeDrawer();
  }).catch(function(e){ toast('Erreur : '+e.message); });
}
function toggleTask(t){
  if(!writeCheck()) return;
  var newStatus = t.status==='fait'?'a_faire':'fait';
  S.db.collection('tasks').doc(t._id).update({status:newStatus}).then(function(){
    logAudit('task', t._id, t.title, 'update', [{field:'status',fieldLabel:'Statut',from:TASK_STATUS_LABELS[t.status]||t.status,to:TASK_STATUS_LABELS[newStatus]||newStatus}]);
  }).catch(function(e){ toast('Erreur : '+e.message); });
}
function moveStage(contactId,newStage){
  if(!writeCheck()) return;
  var c=byId(S.contacts,contactId);
  if(c && c.stage===newStage) return;
  var oldStage = c? c.stage : null;
  S.db.collection('contacts').doc(contactId).update({stage:newStage, updatedAt:nowISO()}).then(function(){
    toast('Étape mise à jour : '+STAGE_MAP[newStage].label);
    logAudit('contact', contactId, c?c.name:contactId, 'update', [{field:'stage',fieldLabel:'Étape',from:(oldStage&&STAGE_MAP[oldStage])?STAGE_MAP[oldStage].label:'—',to:STAGE_MAP[newStage].label}]);
  }).catch(function(e){ toast('Erreur : '+e.message); });
}
function launchCampaign(id){
  if(!writeCheck()) return;
  var camp=byId(S.campaigns,id);
  if(!camp || camp.status!=='brouillon') return;
  var targets=campaignTargets(camp);
  var sent=targets.length;
  var opened=Math.round(sent*(0.4+Math.random()*0.35));
  var clicked=Math.round(opened*(0.15+Math.random()*0.3));
  var converted=Math.round(clicked*(0.05+Math.random()*0.15));
  var stats={targeted:sent, sent:sent, opened:opened, clicked:clicked, converted:converted};
  S.db.collection('campaigns').doc(id).update({status:'terminee', stats:stats, launchedAt:nowISO()}).then(function(){
    toast('Campagne lancée (statistiques simulées).');
    logAudit('campaign', id, camp.name, 'update', [{field:'status',fieldLabel:'Statut',from:'Brouillon',to:'Terminée'}]);
  }).catch(function(e){ toast('Erreur : '+e.message); });
}
function csvEscape(v){
  v = v==null? '' : String(v);
  if(/[",\n;]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function exportContactsCsv(){
  if(!window.claude || !window.claude.use){ toast('Export indisponible dans cet aperçu.'); return; }
  window.claude.use('downloads').then(function(downloads){
    if(!downloads){ toast('Export indisponible dans cette vue.'); return; }
    var rows=[['Nom','Société','Type','Étape','Source','Score','Montant (FCFA)','Propriétaire','Créé le']];
    S.contacts.forEach(function(c){
      rows.push([c.name, c.company||'', c.isPartner?'Partenaire':'Contact', c.isPartner?'':(STAGE_MAP[c.stage]?STAGE_MAP[c.stage].label:''), c.source||'', c.isPartner?'':(c.score||0), c.isPartner?'':(c.amount||0), profileName(c.ownerId)||'', fmtDate(c.createdAt)]);
    });
    var csv = rows.map(function(r){ return r.map(csvEscape).join(';'); }).join('\r\n');
    downloads.save({filename:'soaga-crm-export-'+new Date().toISOString().slice(0,10)+'.csv', data:'﻿'+csv}).then(function(){
      toast('Export téléchargé.');
    }).catch(function(e){
      if(e && e.code==='declined') return;
      toast('Export impossible : '+((e&&e.message)||'erreur inconnue'));
    });
  });
}

/* ===================== event delegation ===================== */
document.addEventListener('click',function(e){
  var navA=e.target.closest('[data-nav]');
  if(navA){ e.preventDefault(); setRoute(navA.getAttribute('data-nav')); return; }

  if(e.target.closest('#hamburger')){ document.getElementById('sidebar').classList.add('show'); document.getElementById('scrim').classList.add('show'); return; }
  if(e.target===document.getElementById('scrim')){ document.getElementById('sidebar').classList.remove('show'); document.getElementById('scrim').classList.remove('show'); return; }

  if(e.target.closest('#btn-new-contact')){
    if(S.route==='activities'){ modalNewTask(null); return; }
    if(S.route==='tickets'){ modalNewTicket(null); return; }
    if(S.route==='campaigns'){ modalNewCampaign(); return; }
    if(S.route==='kb'){ modalNewKbArticle(); return; }
    modalNewContact(); return;
  }

  if(e.target.closest('#userchip')){ modalMyRole(); return; }
  var pickRole=e.target.closest('[data-pick-role]');
  if(pickRole){
    if(writeCheck() && S.me && S.me.id){
      var role=pickRole.getAttribute('data-pick-role');
      S.db.collection('team').doc(S.me.id).set({role:role, updatedAt:nowISO(), updatedBy:S.me.id}).then(function(){
        toast('Rôle mis à jour : '+ROLES[role]);
        closeModal();
      }).catch(function(e){ toast('Erreur : '+e.message); });
    }
    return;
  }

  var launchBtn=e.target.closest('[data-launch-campaign]');
  if(launchBtn){ launchCampaign(launchBtn.getAttribute('data-launch-campaign')); return; }

  if(e.target.closest('#export-csv')){ exportContactsCsv(); return; }

  var escBtn=e.target.closest('[data-escalate-ticket]');
  if(escBtn){
    if(!writeCheck()) return;
    var etid=escBtn.getAttribute('data-escalate-ticket');
    var etk=byId(S.tickets,etid);
    var escLabel = etk?etk.subject:etid;
    var escContactId = etk?etk.contactId:null;
    S.db.collection('tickets').doc(etid).update({escalated:true, escalatedAt:nowISO(), priority:'urgente'}).then(function(){
      toast('Ticket escaladé.');
      logAudit('ticket', etid, escLabel, 'update', [{field:'escalated',fieldLabel:'Escalade',from:'Non',to:'Oui'}]);
      return S.db.collection('tasks').add({
        title:'Escalade : '+escLabel, type:'tache', dueDate:nowISO(),
        contactId:escContactId, status:'a_faire', notes:'Créée automatiquement par escalade du ticket.',
        assigneeId:null, createdBy:(S.me&&S.me.id)||null, createdAt:nowISO()
      });
    }).then(function(taskRef){ if(taskRef) logAudit('task', taskRef.id, 'Escalade : '+escLabel, 'create', null); })
    .catch(function(e){ toast('Erreur : '+e.message); });
    return;
  }

  var csatBtn=e.target.closest('[data-csat-ticket]');
  if(csatBtn){
    if(!writeCheck()) return;
    var tid=csatBtn.getAttribute('data-csat-ticket');
    var val=Number(csatBtn.getAttribute('data-csat-value'));
    var tk=byId(S.tickets,tid);
    S.db.collection('tickets').doc(tid).update({csat:val, csatAt:nowISO()}).then(function(){
      toast('Merci, satisfaction enregistrée ('+val+'/5).');
      logAudit('ticket', tid, tk?tk.subject:tid, 'update', [{field:'csat',fieldLabel:'Satisfaction',from:(tk&&tk.csat)?tk.csat+'/5':'—',to:val+'/5'}]);
    }).catch(function(e){ toast('Erreur : '+e.message); });
    return;
  }

  var lf=e.target.closest('[data-lead-filter]'); if(lf){ S.leadFilter=lf.getAttribute('data-lead-filter'); render(); return; }
  var cf=e.target.closest('[data-client-filter]'); if(cf){ S.clientFilter=cf.getAttribute('data-client-filter'); render(); return; }
  var tf=e.target.closest('[data-task-filter]'); if(tf){ S.taskFilter=tf.getAttribute('data-task-filter'); render(); return; }
  var tkf=e.target.closest('[data-ticket-filter]'); if(tkf){ S.ticketFilter=tkf.getAttribute('data-ticket-filter'); render(); return; }

  var taskCheck=e.target.closest('[data-task-check]');
  if(taskCheck){ e.stopPropagation(); var t=byId(S.tasks,taskCheck.getAttribute('data-task-check')); if(t) toggleTask(t); return; }

  var openC=e.target.closest('[data-open-contact]');
  if(openC && !e.target.closest('[data-task-check]')){ openDrawer(openC.getAttribute('data-open-contact')); return; }

  var openTk=e.target.closest('[data-open-ticket]');
  if(openTk){ var cid=openTk.getAttribute('data-contact-id'); if(cid) openDrawer(cid,'tickets'); return; }

  if(e.target.closest('#drawer-close')){ closeDrawer(); return; }
  if(e.target===document.getElementById('drawer-scrim')){ closeDrawer(); return; }

  var dtab=e.target.closest('[data-drawer-tab]'); if(dtab){ S.drawer.tab=dtab.getAttribute('data-drawer-tab'); renderDrawer(); return; }

  if(e.target.closest('#save-contact')){ var c=byId(S.contacts,S.drawer.contactId); if(c) saveContactFromDrawer(c); return; }
  if(e.target.closest('#log-interaction')){
    var txt=document.getElementById('log-text').value.trim();
    var type=document.getElementById('log-type').value;
    if(!txt){ toast('Ajoutez un résumé.'); return; }
    if(!writeCheck()) return;
    var cForLog=byId(S.contacts,S.drawer.contactId);
    S.db.collection('interactions').add({contactId:S.drawer.contactId, type:type, text:txt, authorId:(S.me&&S.me.id)||null, createdAt:nowISO()})
      .then(function(ref){
        toast('Échange ajouté à l\'historique.');
        logAudit('interaction', ref.id, (INTERACTION_TYPES[type]||type)+' avec '+(cForLog?cForLog.name:'un contact'), 'create', null);
      }).catch(function(e2){ toast('Erreur : '+e2.message); });
    return;
  }
  if(e.target.closest('#add-task-for-contact')){ modalNewTask(S.drawer.contactId); return; }
  if(e.target.closest('#add-ticket-for-contact')){ modalNewTicket(S.drawer.contactId); return; }
  var assignMe=e.target.closest('[data-assign-me]');
  if(assignMe){
    if(writeCheck() && S.me && S.me.id){
      var cidAssign=assignMe.getAttribute('data-assign-me');
      var cForAssign=byId(S.contacts,cidAssign);
      var oldOwner=cForAssign?cForAssign.ownerId:null;
      if(oldOwner===S.me.id) return;
      S.db.collection('contacts').doc(cidAssign).update({ownerId:S.me.id}).then(function(){
        toast('Vous êtes assigné.');
        logAudit('contact', cidAssign, cForAssign?cForAssign.name:cidAssign, 'update', [{field:'ownerId',fieldLabel:'Propriétaire',from:oldOwner?(profileName(oldOwner)||'un membre'):'Non assigné',to:S.me.name||'Vous'}]);
      });
    }
    return;
  }

  var delBtn=e.target.closest('[data-delete]');
  if(delBtn){
    e.stopPropagation();
    if(delBtn.getAttribute('data-confirming')==='1'){
      var parts=delBtn.getAttribute('data-delete').split(':');
      deleteDoc(parts[0],parts[1]);
    } else {
      delBtn.setAttribute('data-confirming','1'); delBtn.textContent='Confirmer la suppression ?'; delBtn.classList.add('confirm-del');
      setTimeout(function(){ if(delBtn.isConnected){ delBtn.removeAttribute('data-confirming'); delBtn.textContent='Supprimer'; delBtn.classList.remove('confirm-del'); } },4000);
    }
    return;
  }

  if(e.target===document.getElementById('modal-scrim')){ closeModal(); return; }
});

document.addEventListener('change',function(e){
  if(e.target.id==='f-ispartner') return;
  var stageSel=e.target.closest('[data-field="stage"]');
  if(stageSel && S.drawer.contactId){ moveStage(S.drawer.contactId,stageSel.value); return; }
  var tkStatus=e.target.closest('[data-ticket-status]');
  if(tkStatus){
    if(!writeCheck()) return;
    var id=tkStatus.getAttribute('data-ticket-status');
    var oldTicket=byId(S.tickets,id);
    var oldTStatus=oldTicket?oldTicket.status:null;
    var patch={status:tkStatus.value};
    if(tkStatus.value==='resolu'||tkStatus.value==='ferme') patch.resolvedAt=nowISO();
    S.db.collection('tickets').doc(id).update(patch).then(function(){
      toast('Statut mis à jour.');
      logAudit('ticket', id, oldTicket?oldTicket.subject:id, 'update', [{field:'status',fieldLabel:'Statut',from:(TICKET_STATUSES[oldTStatus]||{}).label||'—',to:TICKET_STATUSES[tkStatus.value].label}]);
    }).catch(function(e2){ toast('Erreur : '+e2.message); });
    return;
  }
  var teamRoleSel=e.target.closest('[data-team-role]');
  if(teamRoleSel){
    if(!writeCheck()) return;
    var memberId=teamRoleSel.getAttribute('data-team-role');
    var newRole=teamRoleSel.value;
    S.db.collection('team').doc(memberId).set({role:newRole, updatedAt:nowISO(), updatedBy:(S.me&&S.me.id)||null}).then(function(){
      toast('Rôle mis à jour.');
      logAudit('team', memberId, profileName(memberId)||memberId, 'update', [{field:'role',fieldLabel:'Rôle',from:'—',to:ROLES[newRole]}]);
    }).catch(function(e3){ toast('Erreur : '+e3.message+(e3.code==='invalid_argument'?' (droits insuffisants)':'')); });
    return;
  }
  if(e.target.id==='report-range'){ S.reportRange=e.target.value; render(); return; }
  if(e.target.id==='report-owner'){ S.reportOwner=e.target.value; render(); return; }
});

document.addEventListener('input',function(e){
  if(e.target.id==='searchinput'){ S.search=e.target.value; render(); var si=document.getElementById('searchinput'); si.focus(); si.setSelectionRange(si.value.length,si.value.length); return; }
  var scoreEl=e.target.closest('[data-field="score"]');
  if(scoreEl){ var lbl=scoreEl.closest('.field').querySelector('label'); if(lbl) lbl.textContent='Score ('+scoreLabel(Number(scoreEl.value))+')'; return; }
});

/* drag & drop pipeline */
var dragId=null;
document.addEventListener('dragstart',function(e){
  var card=e.target.closest('[data-card-id]');
  if(card){ dragId=card.getAttribute('data-card-id'); card.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',dragId);}catch(err){} }
});
document.addEventListener('dragend',function(e){
  var card=e.target.closest('[data-card-id]'); if(card) card.classList.remove('dragging');
});
document.addEventListener('dragover',function(e){
  var col=e.target.closest('[data-stage-col]');
  if(col){ e.preventDefault(); e.dataTransfer.dropEffect='move'; }
});
document.addEventListener('dragenter',function(e){
  var col=e.target.closest('[data-stage-col]'); if(col) col.classList.add('dragover');
});
document.addEventListener('dragleave',function(e){
  var col=e.target.closest('[data-stage-col]');
  if(col && !col.contains(e.relatedTarget)) col.classList.remove('dragover');
});
document.addEventListener('drop',function(e){
  var col=e.target.closest('[data-stage-col]');
  if(col){
    e.preventDefault(); col.classList.remove('dragover');
    var id=dragId; dragId=null;
    if(id){ var c=byId(S.contacts,id); var stage=col.getAttribute('data-stage-col'); if(c && c.stage!==stage) moveStage(id,stage); }
  }
});

/* ===================== boot ===================== */
renderNav(); renderTopbar();
var initialRoute=(location.hash||'#dashboard').slice(1).split('?')[0];
if(!NAV.some(function(n){return n.id===initialRoute;})) initialRoute='dashboard';
S.route=initialRoute;
render();
initCapabilities();

})();
</script>
